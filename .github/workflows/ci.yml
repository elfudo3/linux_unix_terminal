name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build (web + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The Pages site serves the desktop app at / and the mobile web app at /mobile/.
      - name: Assemble site
        run: |
          mkdir -p site/mobile
          cp -r apps/web/dist/. site/
          cp -r apps/mobile/dist/. site/mobile/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync android
        working-directory: apps/mobile
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-trainer-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
        working-directory: apps/mobile
      - name: Build for the simulator (no signing needed)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
        working-directory: apps/mobile

  # Publishes the site to GitHub Pages on pushes to the repository's default branch.
  # One-time setup by a repo admin: Settings → Pages → Source: GitHub Actions.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
